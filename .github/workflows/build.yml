name: OverInk build
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.1 or v0.1.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: overink-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.99.1'

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${RELEASE_INPUT#v}
          if [[ ! $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || ${#version} -gt 64 ]]; then
            echo "::error::Enter a version such as 0.1.1 or v0.1.1."
            exit 1
          fi
          printf 'version=%s\ntag=v%s\n' "$version" "$version" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: x86_64-pc-windows-msvc, msvc: x64}
          - {os: windows-2022, target: i686-pc-windows-msvc, msvc: x86}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc, msvc: arm64}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: macos-15, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Link the macOS availability runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          runtime_dir="$(xcrun clang -print-resource-dir)/lib/darwin"
          mkdir -p "$RUNNER_TEMP/overink-clang-runtime"
          cp "$runtime_dir/libclang_rt.osx.a" "$RUNNER_TEMP/overink-clang-runtime/"
          target_key=$(printf '%s' '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${target_key}_RUSTFLAGS=-Lnative=$RUNNER_TEMP/overink-clang-runtime -lstatic=clang_rt.osx" >> "$GITHUB_ENV"
      - name: Check and build
        if: runner.os != 'Windows'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          OVERINK_TARGET: ${{ matrix.target }}
        run: |
          set -eu
          cargo fmt --all -- --check
          cargo clippy --locked --target "$OVERINK_TARGET" --all-targets -- -D warnings
          cargo test --locked --release --target "$OVERINK_TARGET"
          cargo build --locked --release --target "$OVERINK_TARGET"
      - name: Check and build with the MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OVERINK_TARGET: ${{ matrix.target }}
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:VCToolsInstallDir "bin/Host$env:VSCMD_ARG_HOST_ARCH/$env:VSCMD_ARG_TGT_ARCH"
          if (!(Test-Path (Join-Path $tools 'link.exe'))) { throw 'MSVC linker not found' }
          $env:PATH = "$tools;$env:PATH"
          # SDL's CMake build and Rust must link the same static MSVC CRT.
          $crt = Join-Path $env:RUNNER_TEMP 'overink-static-crt.cmake'
          @('set(CMAKE_POLICY_DEFAULT_CMP0091 NEW)',
            'set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded" CACHE STRING "")') |
            Set-Content -Encoding ascii $crt
          $env:CMAKE_TOOLCHAIN_FILE = $crt
          cargo fmt --all -- --check
          cargo clippy --locked --target $env:OVERINK_TARGET --all-targets -- -D warnings
          cargo test --locked --release --target $env:OVERINK_TARGET
          $icon = Join-Path $env:RUNNER_TEMP 'overink.ico'
          $rc = Join-Path $env:RUNNER_TEMP 'overink.rc'
          $res = Join-Path $env:RUNNER_TEMP 'overink.res'
          python -c "import pathlib,struct,sys; p=pathlib.Path('assets/overink.png').read_bytes(); pathlib.Path(sys.argv[1]).write_bytes(struct.pack('<HHHBBBBHHII',0,1,1,0,0,0,0,1,32,len(p),22)+p)" $icon
          ('1 ICON "' + $icon.Replace('\', '/') + '"') | Set-Content -Encoding ascii $rc
          & rc.exe /nologo /fo $res $rc
          cargo rustc --locked --release --target $env:OVERINK_TARGET --bin overink -- -C "link-arg=$res"
          $imports = & dumpbin.exe /DEPENDENTS "target/$env:OVERINK_TARGET/release/overink.exe"
          $imports
          if ($imports -match '^\s*(?:VCRUNTIME|MSVCP|CONCRT)\d[^\s]*\.dll\s*$') {
            throw 'The OverInk executable still requires the Visual C++ redistributable'
          }
      - name: Package executable
        shell: bash
        env:
          OVERINK_TARGET: ${{ matrix.target }}
          OVERINK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, shutil, subprocess, zipfile
          target = os.environ['OVERINK_TARGET']
          dist = pathlib.Path('dist')
          dist.mkdir(exist_ok=True)
          exe = 'overink.exe' if 'windows' in target else 'overink'
          binary = pathlib.Path('target') / target / 'release' / exe
          if 'apple-darwin' in target:
              app = dist / 'OverInk.app'
              contents = app / 'Contents'
              (contents / 'MacOS').mkdir(parents=True, exist_ok=True)
              (contents / 'Resources').mkdir(exist_ok=True)
              shutil.copy2('LICENSE', contents / 'Resources' / 'LICENSE')
              shutil.copy2('assets/fonts/OFL.txt', contents / 'Resources' / 'OFL.txt')
              iconset = dist / 'OverInk.iconset'
              iconset.mkdir(exist_ok=True)
              for size in (16, 32, 128, 256, 512):
                  for scale in (1, 2):
                      suffix = '@2x' if scale == 2 else ''
                      pixels = str(size * scale)
                      subprocess.run(['sips', '-z', pixels, pixels, 'assets/overink.png', '--out',
                                      str(iconset / f'icon_{size}x{size}{suffix}.png')], check=True)
              subprocess.run(['iconutil', '-c', 'icns', str(iconset), '-o',
                              str(contents / 'Resources' / 'OverInk.icns')], check=True)
              shutil.rmtree(iconset)
              destination = contents / 'MacOS' / 'overink'
              shutil.copy2(binary, destination)
              destination.chmod(0o755)
              info = dict(CFBundleName='OverInk', CFBundleDisplayName='OverInk',
                          CFBundleExecutable='overink', CFBundleIdentifier='org.overink.OverInk',
                          CFBundlePackageType='APPL',
                          CFBundleShortVersionString=os.environ.get('OVERINK_RELEASE_VERSION') or '0.1.0',
                          CFBundleVersion='1', LSMinimumSystemVersion='11.0',
                          CFBundleDevelopmentRegion='en', CFBundleLocalizations=['en', 'zh-Hans', 'zh-Hant'],
                          CFBundleIconFile='OverInk.icns',
                          NSHighResolutionCapable=True, NSPrincipalClass='NSApplication')
              with (contents / 'Info.plist').open('wb') as stream:
                  plistlib.dump(info, stream)
              subprocess.run(['codesign', '--force', '--sign', '-', str(app)], check=True)
              subprocess.run(['ditto', '-c', '-k', '--keepParent', str(app), str(dist / f'OverInk-{target}.zip')], check=True)
              shutil.rmtree(app)
          elif 'windows' in target:
              with zipfile.ZipFile(dist / f'OverInk-{target}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  archive.write(binary, exe)
                  archive.write('LICENSE', 'LICENSE')
                  archive.write('assets/fonts/OFL.txt', 'OFL.txt')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: OverInk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  linux:
    needs: prepare
    name: Linux ${{ matrix.target }} · UBI 10 ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux/amd64, mode: native, target: x86_64-unknown-linux-gnu, deb: amd64, triple: x86_64-linux-gnu, suite: noble, gcc: 13, machine: X86-64}
          - {runner: ubuntu-24.04-arm, platform: linux/arm64, mode: native, target: aarch64-unknown-linux-gnu, deb: arm64, triple: aarch64-linux-gnu, suite: noble, gcc: 13, machine: AArch64}
          - {runner: ubuntu-24.04, platform: linux/amd64, mode: cross, target: i686-unknown-linux-gnu, deb: i386, triple: i686-linux-gnu, suite: trixie, gcc: 14, machine: 'Intel 80386'}
          - {runner: ubuntu-24.04, platform: linux/amd64, mode: cross, target: powerpc64le-unknown-linux-gnu, deb: ppc64el, triple: powerpc64le-linux-gnu, suite: trixie, gcc: 14, machine: PowerPC64}
          - {runner: ubuntu-24.04, platform: linux/amd64, mode: cross, target: loongarch64-unknown-linux-gnu, deb: loong64, triple: loongarch64-linux-gnu, suite: forky, gcc: 15, machine: LoongArch}
          - {runner: ubuntu-24.04, platform: linux/amd64, mode: cross, target: riscv64gc-unknown-linux-gnu, deb: riscv64, triple: riscv64-linux-gnu, suite: trixie, gcc: 14, machine: RISC-V}
          - {runner: ubuntu-24.04, platform: linux/amd64, mode: cross, target: s390x-unknown-linux-gnu, deb: s390x, triple: s390x-linux-gnu, suite: trixie, gcc: 14, machine: S/390}
    steps:
      - uses: actions/checkout@v5
      - name: Stage the target SDK without executing target binaries
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.deb }}
          TARGET_SUITE: ${{ matrix.suite }}
          TARGET_GCC: ${{ matrix.gcc }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwayland-bin
          work="$RUNNER_TEMP/overink-linux"
          mkdir -p "$work"/{sysroot,lists/partial,archives/partial,tools}
          cp "$(command -v wayland-scanner)" "$work/tools/"
          if [[ $TARGET_ARCH == loong64 ]]; then
            # UBI's LLVM build only enables the targets supported by RHEL.
            # Carry the x64 LLVM tools from the upstream Ubuntu repository into UBI.
            curl -fsSL --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key -o "$work/llvm.asc"
            sudo install -m 0644 "$work/llvm.asc" /usr/share/keyrings/overink-llvm.asc
            echo 'deb [signed-by=/usr/share/keyrings/overink-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' |
              sudo tee /etc/apt/sources.list.d/overink-llvm.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang-20 lld-20
            clang-20 --print-targets | grep -i loongarch
            mkdir -p "$work/llvm/bin" "$work/llvm/lib/clang"
            for tool in clang clang++ ld.lld; do cp -L "/usr/lib/llvm-20/bin/$tool" "$work/llvm/bin/"; done
            cp -R "$(clang-20 -print-resource-dir)" "$work/llvm/lib/clang/"
            ldd "$work/llvm/bin/clang" "$work/llvm/bin/ld.lld" |
              awk '/ => \/.* / {print $1, $3}' | sort -u |
              while read -r soname path; do
                case "$soname" in libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*) continue;; esac
                cp -L "$path" "$work/llvm/lib/$soname"
              done
          fi
          : > "$work/status"
          if [[ $TARGET_SUITE == noble ]]; then
            keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg
            repo=https://archive.ubuntu.com/ubuntu
            if [[ $TARGET_ARCH == arm64 ]]; then repo=https://ports.ubuntu.com/ubuntu-ports; fi
          else
            keyring="$work/debian.asc"
            curl -fsSL --retry 3 https://ftp-master.debian.org/keys/archive-key-13.asc -o "$keyring"
            repo=https://deb.debian.org/debian
          fi
          printf 'deb [arch=%s signed-by=%s] %s %s main\n' "$TARGET_ARCH" "$keyring" "$repo" "$TARGET_SUITE" > "$work/sources.list"
          apt_options=(
            -o "APT::Architecture=$TARGET_ARCH"
            -o "APT::Architectures::=$TARGET_ARCH"
            -o "Dir::Etc::sourcelist=$work/sources.list"
            -o Dir::Etc::sourceparts=-
            -o "Dir::State::lists=$work/lists"
            -o "Dir::State::status=$work/status"
            -o "Dir::Cache::archives=$work/archives"
            -o Acquire::Retries=3
          )
          apt-get "${apt_options[@]}" update
          apt-get "${apt_options[@]}" -y --download-only --no-install-recommends install \
            libc6-dev "libgcc-$TARGET_GCC-dev" "libstdc++-$TARGET_GCC-dev" \
            libx11-dev libxext-dev libxi-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxrender-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libegl-dev libgl-dev
          for package in "$work/archives/"*.deb; do dpkg-deb -x "$package" "$work/sysroot"; done
          python3 - "$work/sysroot" <<'PY'
          import os, pathlib, shutil, sys
          root = pathlib.Path(sys.argv[1])
          # A package-only SDK does not include the merged-/usr layout created
          # by the distribution installer. GNU libc linker scripts use /lib.
          for name in ('lib', 'lib64', 'lib32', 'libx32'):
              old = root / name
              new = root / 'usr' / name
              if old.is_dir() and not old.is_symlink():
                  shutil.copytree(old, new, dirs_exist_ok=True, symlinks=True)
                  shutil.rmtree(old)
              if not old.is_symlink() and not old.exists() and new.is_dir():
                  old.symlink_to('usr/' + name)
          for directory, dirs, files in os.walk(root, followlinks=False):
              for name in dirs + files:
                  path = pathlib.Path(directory) / name
                  if path.is_symlink():
                      target = os.readlink(path)
                      if target.startswith('/'):
                          path.unlink()
                          path.symlink_to(os.path.relpath(root / target.lstrip('/'), path.parent))
          PY
      - name: Compile and package in Red Hat UBI 10
        shell: bash
        env:
          OVERINK_TARGET: ${{ matrix.target }}
          TARGET_TRIPLE: ${{ matrix.triple }}
          TARGET_MODE: ${{ matrix.mode }}
          ELF_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          docker run --rm -i --platform '${{ matrix.platform }}' \
            -e RUST_VERSION -e OVERINK_TARGET -e TARGET_TRIPLE -e TARGET_MODE -e ELF_MACHINE \
            -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/overink-linux:/sdk:ro" -w /src \
            registry.access.redhat.com/ubi10/ubi:latest bash -s <<'CONTAINER'
          set -euo pipefail
          dnf install -y --enablerepo='ubi-10-*' --setopt=install_weak_deps=False \
            gcc gcc-c++ clang lld llvm cmake make pkgconf-pkg-config \
            findutils diffutils binutils tar gzip xz expat libxml2 dbus-daemon
          export PATH="/sdk/tools:$PATH"
          wayland-scanner --version
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://sh.rustup.rs -o /tmp/overink-rustup.sh
          sh /tmp/overink-rustup.sh -y --profile minimal --default-toolchain "$RUST_VERSION" --component rustfmt --component clippy
          . "$HOME/.cargo/env"
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [[ $TARGET_MODE == native ]]; then test "$host" = "$OVERINK_TARGET"; else test "$host" != "$OVERINK_TARGET"; fi
          rustup target add "$OVERINK_TARGET"
          export CARGO_BUILD_JOBS=2
          export CARGO_TARGET_DIR=/tmp/overink-target
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_SYSROOT_DIR=/sdk/sysroot
          multiarch=$TARGET_TRIPLE
          if [[ $TARGET_TRIPLE == i686-linux-gnu ]]; then multiarch=i386-linux-gnu; fi
          export PKG_CONFIG_LIBDIR="/sdk/sysroot/usr/lib/$multiarch/pkgconfig:/sdk/sysroot/usr/share/pkgconfig"
          gcc_dir=$(find /sdk/sysroot/usr/lib/gcc -name crtbeginS.o -print -quit)
          test -n "$gcc_dir"
          gcc_dir=${gcc_dir%/*}
          mkdir /tmp/overink-cc
          for compiler in clang clang++; do
            driver="/usr/bin/$compiler"
            linker=lld
            compiler_env=
            if [[ -x /sdk/llvm/bin/$compiler ]]; then
              driver="/sdk/llvm/bin/$compiler"
              linker=/sdk/llvm/bin/ld.lld
              compiler_env=LD_LIBRARY_PATH=/sdk/llvm/lib
            fi
            cat > "/tmp/overink-cc/$compiler" <<WRAPPER
          #!/bin/sh
          exec env $compiler_env "$driver" --target=$TARGET_TRIPLE --sysroot=/sdk/sysroot --gcc-install-dir=$gcc_dir -fuse-ld=$linker -Qunused-arguments "\$@"
          WRAPPER
            chmod +x "/tmp/overink-cc/$compiler"
          done
          key=${OVERINK_TARGET//-/_}
          upper=${key^^}
          export "CC_$key=/tmp/overink-cc/clang" "CXX_$key=/tmp/overink-cc/clang++" "AR_$key=llvm-ar"
          export "CARGO_TARGET_${upper}_LINKER=/tmp/overink-cc/clang"
          export CMAKE_TOOLCHAIN_FILE=/tmp/overink-toolchain.cmake
          if [[ $TARGET_MODE == cross ]]; then
            printf 'set(CMAKE_SYSTEM_NAME Linux)\nset(CMAKE_SYSTEM_PROCESSOR %s)\n' "${TARGET_TRIPLE%%-*}" > "$CMAKE_TOOLCHAIN_FILE"
          fi
          cat >> "$CMAKE_TOOLCHAIN_FILE" <<'CMAKE'
          set(CMAKE_SYSROOT /sdk/sysroot)
          set(CMAKE_C_COMPILER /tmp/overink-cc/clang)
          set(CMAKE_CXX_COMPILER /tmp/overink-cc/clang++)
          set(CMAKE_AR /usr/bin/llvm-ar)
          set(CMAKE_RANLIB /usr/bin/llvm-ranlib)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          set(SDL_X11_SHARED ON CACHE BOOL "" FORCE)
          set(SDL_WAYLAND_SHARED ON CACHE BOOL "" FORCE)
          CMAKE
          if [[ $TARGET_MODE == native ]]; then
            loader=$(find "/sdk/sysroot/usr/lib/$multiarch" -type f -name 'ld-linux*.so*' -print -quit)
            test -n "$loader"
            cat > /tmp/overink-cc/run-native <<WRAPPER
          #!/bin/sh
          exec "$loader" --library-path "/sdk/sysroot/usr/lib/$multiarch:/sdk/sysroot/lib/$multiarch" "\$@"
          WRAPPER
            chmod +x /tmp/overink-cc/run-native
            export "CARGO_TARGET_${upper}_RUNNER=/tmp/overink-cc/run-native"
            cargo fmt --all -- --check
            cargo clippy --locked --target "$OVERINK_TARGET" --all-targets -- -D warnings
            cargo test --locked --release --target "$OVERINK_TARGET"
            dbus-run-session -- cargo test --locked --release --target "$OVERINK_TARGET" portal_response -- --ignored
          fi
          cargo build --locked --release --target "$OVERINK_TARGET"
          output="$CARGO_TARGET_DIR/$OVERINK_TARGET/release"
          config=$(find "$output/build" -name SDL_build_config.h -print -quit)
          test -n "$config"
          grep -q '^#define SDL_VIDEO_DRIVER_X11 1' "$config"
          grep -q '^#define SDL_VIDEO_DRIVER_WAYLAND 1' "$config"
          grep -q '^#define SDL_VIDEO_DRIVER_X11_DYNAMIC "libX11\.so' "$config"
          grep -q '^#define SDL_VIDEO_DRIVER_WAYLAND_DYNAMIC "libwayland-client\.so' "$config"
          readelf -h "$output/overink" | grep -iE "Machine:.*$ELF_MACHINE"
          case "$OVERINK_TARGET" in
            i686-*) readelf -h "$output/overink" | grep -q 'Class:.*ELF32' ;;
            s390x-*) readelf -h "$output/overink" | grep -q 'Data:.*big endian' ;;
            *) readelf -h "$output/overink" | grep -q 'Data:.*little endian' ;;
          esac
          if [[ $TARGET_MODE == native ]]; then
            OVERINK_STATE_DIR=/tmp/overink-smoke /tmp/overink-cc/run-native "$output/overink" --smoke-test
          fi
          mkdir -p dist
          tar -czf "dist/OverInk-$OVERINK_TARGET.tar.gz" -C "$output" overink -C /src LICENSE assets/fonts/OFL.txt
          CONTAINER
      - uses: actions/upload-artifact@v4
        with:
          name: OverInk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  freebsd:
    needs: prepare
    name: FreeBSD ${{ matrix.target }} · x64 VM
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-freebsd, cpu: x86_64, abi: amd64, layout: amd64/amd64, release: '15.1', machine: x86-64}
          - {target: i686-unknown-freebsd, cpu: i686, abi: i386, layout: i386/i386, release: '14.4', machine: '80386'}
          - {target: powerpc64le-unknown-freebsd, cpu: powerpc64le, abi: powerpc64le, layout: powerpc/powerpc64le, release: '15.1', machine: PowerPC64}
          - {target: aarch64-unknown-freebsd, cpu: aarch64, abi: aarch64, layout: arm64/aarch64, release: '15.1', machine: AArch64}
          - {target: riscv64gc-unknown-freebsd, cpu: riscv64, abi: riscv64, layout: riscv/riscv64, release: '15.1', machine: RISC-V}
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          arch: x86_64
          release: '15.1'
          usesh: true
          sync: scp
          envs: RUST_VERSION
          mem: 8192
          cpu: 3
          prepare: |
            pkg install -y curl cmake ninja pkgconf python3 libX11 libXext libXi libXrandr \
              libXcursor libXfixes libXrender libXScrnSaver libXtst libxcb libglvnd \
              wayland wayland-protocols libxkbcommon mesa-libs
          run: |
            set -eu
            export PATH="/usr/local/bin:$PATH"
            target='${{ matrix.target }}'
            machine='${{ matrix.machine }}'
            release='${{ matrix.release }}'
            test "$(uname -m)" = amd64
            fetch -qo /tmp/overink-rustup.sh https://sh.rustup.rs
            sh /tmp/overink-rustup.sh -y --profile minimal --default-toolchain "$RUST_VERSION"
            . "$HOME/.cargo/env"
            host=$(rustc -vV | sed -n 's/^host: //p')
            test "$host" = x86_64-unknown-freebsd
            export CARGO_BUILD_JOBS=2
            export CARGO_TARGET_DIR=/tmp/overink-target
            build_std=false
            if rustup target list | awk '{print $1}' | grep -qx "$target"; then
              rustup target add "$target"
            else
              rustc --print target-list | grep -qx "$target"
              rustup component add rust-src
              build_std=true
            fi
            if [ "$target" != "$host" ]; then
              work=$(mktemp -d)
              sysroot="$work/sysroot"
              mkdir -p "$sysroot"
              url="https://download.freebsd.org/releases/${{ matrix.layout }}/$release-RELEASE"
              fetch -qo "$work/MANIFEST" "$url/MANIFEST"
              fetch -qo "$work/base.txz" "$url/base.txz"
              expected=$(awk '$1 == "base.txz" { print $2 }' "$work/MANIFEST")
              test -n "$expected"
              test "$(sha256 -q "$work/base.txz")" = "$expected"
              tar -xf "$work/base.txz" -C "$sysroot"
              # X11/Wayland are dynamic SDL backends. Their public headers are
              # shared across FreeBSD ABIs. Native libraries supply SONAMEs only.
              mkdir -p "$sysroot/usr/local/include"
              for header in /usr/local/include/X11 /usr/local/include/xcb /usr/local/include/wayland*.h \
                  /usr/local/include/xkbcommon /usr/local/include/GL /usr/local/include/EGL \
                  /usr/local/include/GLES* /usr/local/include/KHR; do
                if [ -e "$header" ]; then cp -RL "$header" "$sysroot/usr/local/include/"; fi
              done
              python3 - "$sysroot" <<'PY'
            import os, pathlib, sys
            root = pathlib.Path(sys.argv[1])
            for directory, dirs, files in os.walk(root, followlinks=False):
                for name in dirs + files:
                    path = pathlib.Path(directory) / name
                    if path.is_symlink():
                        target = os.readlink(path)
                        if target.startswith('/'):
                            path.unlink()
                            path.symlink_to(os.path.relpath(root / target.lstrip('/'), path.parent))
            PY
              triple="${{ matrix.cpu }}-unknown-freebsd$release"
              extra=
              if [ '${{ matrix.cpu }}' = riscv64 ]; then extra='-march=rv64gc -mabi=lp64d'; fi
              for compiler in clang clang++; do
                cat > "$work/$compiler" <<WRAPPER
            #!/bin/sh
            exec /usr/bin/$compiler --target=$triple --sysroot="$sysroot" -fuse-ld=lld -Qunused-arguments $extra "\$@"
            WRAPPER
                chmod +x "$work/$compiler"
              done
              # Probe this header without trying to link the native X11 ELF.
              printf '#include <X11/XKBlib.h>\n' |
                "$work/clang" -isystem "$sysroot/usr/local/include" -x c -fsyntax-only -
              key=$(printf '%s' "$target" | tr '-' '_')
              upper=$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]')
              export "CC_$key=$work/clang" "CXX_$key=$work/clang++" "AR_$key=ar"
              export "CARGO_TARGET_${upper}_LINKER=$work/clang"
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_SYSROOT_DIR="$sysroot"
              export PKG_CONFIG_LIBDIR=/usr/local/libdata/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
              export CMAKE_TOOLCHAIN_FILE="$work/toolchain.cmake"
              cat > "$CMAKE_TOOLCHAIN_FILE" <<CMAKE
            set(CMAKE_SYSTEM_NAME FreeBSD)
            set(CMAKE_SYSTEM_PROCESSOR ${{ matrix.cpu }})
            set(CMAKE_SYSROOT "$sysroot")
            set(CMAKE_C_COMPILER "$work/clang")
            set(CMAKE_CXX_COMPILER "$work/clang++")
            set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
            set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
            set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY BOTH)
            set(CMAKE_LIBRARY_PATH /usr/local/lib)
            set(HAVE_XKBLIB_H ON CACHE INTERNAL "Cross-checked XKB header")
            set(SDL_X11_SHARED ON CACHE BOOL "" FORCE)
            set(SDL_WAYLAND_SHARED ON CACHE BOOL "" FORCE)
            set(SDL_WAYLAND_LIBDECOR OFF CACHE BOOL "" FORCE)
            set(SDL_KMSDRM OFF CACHE BOOL "" FORCE)
            CMAKE
            else
              cargo test --locked --release --target "$target"
            fi
            if [ "$build_std" = true ]; then
              RUSTC_BOOTSTRAP=1 CARGO_PROFILE_RELEASE_PANIC=abort cargo build \
                -Z build-std=std,panic_abort --locked --release --target "$target"
            else
              cargo build --locked --release --target "$target"
            fi
            output="$CARGO_TARGET_DIR/$target/release"
            config=$(find "$output/build" -name SDL_build_config.h -print -quit)
            test -n "$config"
            grep -q '^#define SDL_VIDEO_DRIVER_X11 1' "$config"
            grep -q '^#define SDL_VIDEO_DRIVER_WAYLAND 1' "$config"
            readelf -h "$output/overink" | grep -iE "Machine:.*$machine"
            # FreeBSD AArch64 and RISC-V identify the ABI in the ELF note.
            readelf -n "$output/overink" | grep -E 'FreeBSD[[:space:]].*NT_FREEBSD_ABI_TAG'
            if [ "$target" != "$host" ]; then
              grep -q '^#define SDL_VIDEO_DRIVER_X11_DYNAMIC "libX11\.so' "$config"
              grep -q '^#define SDL_VIDEO_DRIVER_WAYLAND_DYNAMIC "libwayland-client\.so' "$config"
              if readelf -d "$output/overink" | grep -E 'NEEDED.*(libX|libwayland|libxkbcommon|libEGL|libGL)'; then
                echo "Graphics libraries must be loaded dynamically on the target"
                exit 1
              fi
            else
              OVERINK_STATE_DIR=/tmp/overink-smoke "$output/overink" --smoke-test
            fi
            mkdir -p dist
            tar -czf "dist/OverInk-$target.tar.gz" -C "$output" overink -C "$PWD" LICENSE assets/fonts/OFL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OverInk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.prepare.outputs.tag }}
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, desktop, linux, freebsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: overink-publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: OverInk-*
          path: release-input
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifact_dirs=(release-input/OverInk-*)
          if (( ${#artifact_dirs[@]} != 17 )); then
            echo "::error::Expected 17 build artifacts. Found ${#artifact_dirs[@]}."
            exit 1
          fi
          mkdir release-assets
          for dir in "${artifact_dirs[@]}"; do
            name=${dir##*/}
            archives=("$dir/$name".*)
            if (( ${#archives[@]} != 1 )); then
              echo "::error::Expected one package in $dir."
              exit 1
            fi
            archive=${archives[0]}
            case "$archive" in
              "$dir/$name.zip"|"$dir/$name.tar.gz") ;;
              *) echo "::error::Unexpected package $archive."; exit 1 ;;
            esac
            test -s "$archive"
            file=${archive##*/}
            cp -- "$archive" "release-assets/OverInk-$RELEASE_VERSION-${file#OverInk-}"
          done

          # A failed upload can be retried using this workflow's draft.
          marker="<!-- overink-build:$GITHUB_SHA -->"
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -cs --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]')
          count=$(jq length <<< "$releases")
          if (( count > 1 )) || { (( count == 1 )) &&
              ! jq -e --arg marker "$marker" '.[0] | .draft and ((.body // "") | startswith($marker))' <<< "$releases" >/dev/null; }; then
            echo "::error::Release $RELEASE_TAG already exists or has a draft from another source."
            exit 1
          fi

          # Git rejects a non-forced push to a tag on a different commit.
          git push origin "$GITHUB_SHA:refs/tags/$RELEASE_TAG"
          if (( count == 0 )); then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --target "$GITHUB_SHA" --generate-notes \
              --title "OverInk $RELEASE_TAG" --notes "$marker"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          tag_sha=$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" | cut -f1)
          if [[ $tag_sha != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG no longer points to the built commit."
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
