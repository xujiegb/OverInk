name: OverInk build
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.1 or v0.1.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: overink-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.99.1'

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${RELEASE_INPUT#v}
          if [[ ! $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || ${#version} -gt 64 ]]; then
            echo "::error::Enter a version such as 0.1.1 or v0.1.1."
            exit 1
          fi
          printf 'version=%s\ntag=v%s\n' "$version" "$version" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, target: x86_64-pc-windows-msvc, msvc: x64}
          - {os: windows-2022, target: i686-pc-windows-msvc, msvc: x86}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc, msvc: arm64}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: macos-15, target: aarch64-apple-darwin}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Link the macOS availability runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          runtime_dir="$(xcrun clang -print-resource-dir)/lib/darwin"
          mkdir -p "$RUNNER_TEMP/overink-clang-runtime"
          cp "$runtime_dir/libclang_rt.osx.a" "$RUNNER_TEMP/overink-clang-runtime/"
          target_key=$(printf '%s' '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${target_key}_RUSTFLAGS=-Lnative=$RUNNER_TEMP/overink-clang-runtime -lstatic=clang_rt.osx" >> "$GITHUB_ENV"
      - name: Check and build
        if: runner.os != 'Windows'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          OVERINK_TARGET: ${{ matrix.target }}
        run: |
          set -eu
          cargo fmt --all -- --check
          cargo clippy --locked --target "$OVERINK_TARGET" --all-targets -- -D warnings
          cargo test --locked --release --target "$OVERINK_TARGET"
          cargo build --locked --release --target "$OVERINK_TARGET"
      - name: Check and build with the MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OVERINK_TARGET: ${{ matrix.target }}
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:VCToolsInstallDir "bin/Host$env:VSCMD_ARG_HOST_ARCH/$env:VSCMD_ARG_TGT_ARCH"
          if (!(Test-Path (Join-Path $tools 'link.exe'))) { throw 'MSVC linker not found' }
          $env:PATH = "$tools;$env:PATH"
          # SDL's CMake build and Rust must link the same static MSVC CRT.
          $crt = Join-Path $env:RUNNER_TEMP 'overink-static-crt.cmake'
          @('set(CMAKE_POLICY_DEFAULT_CMP0091 NEW)',
            'set(CMAKE_MSVC_RUNTIME_LIBRARY "MultiThreaded" CACHE STRING "")') |
            Set-Content -Encoding ascii $crt
          $env:CMAKE_TOOLCHAIN_FILE = $crt
          cargo fmt --all -- --check
          cargo clippy --locked --target $env:OVERINK_TARGET --all-targets -- -D warnings
          cargo test --locked --release --target $env:OVERINK_TARGET
          $icon = Join-Path $env:RUNNER_TEMP 'overink.ico'
          $rc = Join-Path $env:RUNNER_TEMP 'overink.rc'
          $res = Join-Path $env:RUNNER_TEMP 'overink.res'
          python -c "import pathlib,struct,sys; p=pathlib.Path('assets/overink.png').read_bytes(); pathlib.Path(sys.argv[1]).write_bytes(struct.pack('<HHHBBBBHHII',0,1,1,0,0,0,0,1,32,len(p),22)+p)" $icon
          ('1 ICON "' + $icon.Replace('\', '/') + '"') | Set-Content -Encoding ascii $rc
          & rc.exe /nologo /fo $res $rc
          cargo rustc --locked --release --target $env:OVERINK_TARGET --bin overink -- -C "link-arg=$res"
          $imports = & dumpbin.exe /DEPENDENTS "target/$env:OVERINK_TARGET/release/overink.exe"
          $imports
          if ($imports -match '^\s*(?:VCRUNTIME|MSVCP|CONCRT)\d[^\s]*\.dll\s*$') {
            throw 'The OverInk executable still requires the Visual C++ redistributable'
          }
      - name: Package executable
        shell: bash
        env:
          OVERINK_TARGET: ${{ matrix.target }}
          OVERINK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, shutil, subprocess, zipfile
          target = os.environ['OVERINK_TARGET']
          dist = pathlib.Path('dist')
          dist.mkdir(exist_ok=True)
          exe = 'overink.exe' if 'windows' in target else 'overink'
          binary = pathlib.Path('target') / target / 'release' / exe
          if 'apple-darwin' in target:
              app = dist / 'OverInk.app'
              contents = app / 'Contents'
              (contents / 'MacOS').mkdir(parents=True, exist_ok=True)
              (contents / 'Resources').mkdir(exist_ok=True)
              shutil.copy2('LICENSE', contents / 'Resources' / 'LICENSE')
              shutil.copy2('assets/fonts/OFL.txt', contents / 'Resources' / 'OFL.txt')
              iconset = dist / 'OverInk.iconset'
              iconset.mkdir(exist_ok=True)
              for size in (16, 32, 128, 256, 512):
                  for scale in (1, 2):
                      suffix = '@2x' if scale == 2 else ''
                      pixels = str(size * scale)
                      subprocess.run(['sips', '-z', pixels, pixels, 'assets/overink.png', '--out',
                                      str(iconset / f'icon_{size}x{size}{suffix}.png')], check=True)
              subprocess.run(['iconutil', '-c', 'icns', str(iconset), '-o',
                              str(contents / 'Resources' / 'OverInk.icns')], check=True)
              shutil.rmtree(iconset)
              destination = contents / 'MacOS' / 'overink'
              shutil.copy2(binary, destination)
              destination.chmod(0o755)
              info = dict(CFBundleName='OverInk', CFBundleDisplayName='OverInk',
                          CFBundleExecutable='overink', CFBundleIdentifier='org.overink.OverInk',
                          CFBundlePackageType='APPL',
                          CFBundleShortVersionString=os.environ.get('OVERINK_RELEASE_VERSION') or '0.1.0',
                          CFBundleVersion='1', LSMinimumSystemVersion='11.0',
                          CFBundleDevelopmentRegion='en', CFBundleLocalizations=['en', 'zh-Hans', 'zh-Hant'],
                          CFBundleIconFile='OverInk.icns',
                          NSHighResolutionCapable=True, NSPrincipalClass='NSApplication')
              with (contents / 'Info.plist').open('wb') as stream:
                  plistlib.dump(info, stream)
              subprocess.run(['codesign', '--force', '--sign', '-', str(app)], check=True)
              subprocess.run(['ditto', '-c', '-k', '--keepParent', str(app), str(dist / f'OverInk-{target}.zip')], check=True)
              shutil.rmtree(app)
          elif 'windows' in target:
              with zipfile.ZipFile(dist / f'OverInk-{target}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  archive.write(binary, exe)
                  archive.write('LICENSE', 'LICENSE')
                  archive.write('assets/fonts/OFL.txt', 'OFL.txt')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: OverInk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  package-macos:
    needs: prepare
    name: macOS DMG · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, target: x86_64-apple-darwin, runner: macos-15-intel}
          - {arch: arm64, target: aarch64-apple-darwin, runner: macos-15}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-dmg-${{ matrix.arch }}
      - name: Install create-dmg
        run: |
          set -euo pipefail
          if ! command -v create-dmg >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          fi
      - name: Build and package DMG
        shell: bash
        env:
          OVERINK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          CODESIGN_IDENTITY: '-'
        run: |
          set -euo pipefail
          bash package-macos.sh --arch '${{ matrix.arch }}' --version "$OVERINK_RELEASE_VERSION"
          mapfile_check=(dist/OverInk-*-macos-${{ matrix.arch }}.dmg)
          [[ ${#mapfile_check[@]} -eq 1 && -s ${mapfile_check[0]} ]] || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: OverInk-dmg-macos-${{ matrix.arch }}
          path: dist/OverInk-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  package-windows:
    needs: prepare
    name: Windows installer · ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, target: x86_64-pc-windows-msvc}
          - {arch: i386, target: i686-pc-windows-msvc}
          - {arch: arm64, target: aarch64-pc-windows-msvc}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-installer-${{ matrix.arch }}
      - name: Build and package native installer
        shell: pwsh
        env:
          OVERINK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./package-windows.ps1 -Arch '${{ matrix.arch }}' -Version $env:OVERINK_RELEASE_VERSION -RustVersion $env:RUST_VERSION
          $packages = @(Get-ChildItem -Path dist -File -Filter 'OverInk-*-windows-${{ matrix.arch }}-setup.exe')
          if ($packages.Count -ne 1 -or $packages[0].Length -le 0) {
            throw 'Expected exactly one non-empty Windows installer'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OverInk-installer-windows-${{ matrix.arch }}
          path: dist/OverInk-*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  linux:
    needs: prepare
    name: Linux ${{ matrix.target }} · Debian 13
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux/amd64, mode: native, target: x86_64-unknown-linux-gnu, deb: amd64, triple: x86_64-linux-gnu, machine: X86-64}
          - {runner: ubuntu-24.04-arm, platform: linux/arm64, mode: native, target: aarch64-unknown-linux-gnu, deb: arm64, triple: aarch64-linux-gnu, machine: AArch64}
          - {runner: ubuntu-24.04, platform: linux/amd64, mode: cross, target: i686-unknown-linux-gnu, deb: i386, triple: i686-linux-gnu, machine: 'Intel 80386'}
          - {runner: ubuntu-24.04, platform: linux/amd64, mode: cross, target: powerpc64le-unknown-linux-gnu, deb: ppc64el, triple: powerpc64le-linux-gnu, machine: PowerPC64}
          - {runner: ubuntu-24.04, platform: linux/amd64, mode: cross, target: loongarch64-unknown-linux-gnu, deb: loong64, triple: loongarch64-linux-gnu, machine: LoongArch}
          - {runner: ubuntu-24.04, platform: linux/amd64, mode: cross, target: riscv64gc-unknown-linux-gnu, deb: riscv64, triple: riscv64-linux-gnu, machine: RISC-V}
          - {runner: ubuntu-24.04, platform: linux/amd64, mode: cross, target: s390x-unknown-linux-gnu, deb: s390x, triple: s390x-linux-gnu, machine: S/390}
    steps:
      - name: Build and test inside Debian 13 Docker
        shell: bash
        env:
          OVERINK_TARGET: ${{ matrix.target }}
          TARGET_TRIPLE: ${{ matrix.triple }}
          TARGET_ARCH: ${{ matrix.deb }}
          TARGET_MODE: ${{ matrix.mode }}
          ELF_MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overink-linux-dist"
          docker run --rm -i --platform '${{ matrix.platform }}' \
            -e RUST_VERSION -e OVERINK_TARGET -e TARGET_TRIPLE -e TARGET_ARCH -e TARGET_MODE -e ELF_MACHINE \
            -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_EVENT_NAME \
            -e GITHUB_PR_NUMBER='${{ github.event.pull_request.number }}' \
            -v "$RUNNER_TEMP/overink-linux-dist:/out" \
            debian:13 bash -s <<'CONTAINER'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export HOME=/root RUSTUP_HOME=/root/.rustup CARGO_HOME=/root/.cargo
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git python3 dpkg-dev xz-utils gzip zstd tar \
            clang lld llvm cmake make ninja-build pkg-config \
            libwayland-bin wayland-protocols \
            libc6-dev libx11-dev libxext-dev libxi-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxrender-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libegl-dev libgl-dev \
            libexpat1-dev libxml2-dev dbus dbus-bin binutils gnupg

          clang_c=/usr/bin/clang
          clang_cxx=/usr/bin/clang++
          clang_linker=/usr/bin/ld.lld
          if [[ $TARGET_ARCH == loong64 ]] && ! clang --print-targets | grep -qi loongarch; then
            curl -fsSL --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm.asc
            fingerprint=$(gpg --show-keys --with-colons /tmp/llvm.asc | awk -F: '$1 == "fpr" {print $10; exit}')
            [[ $fingerprint == 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421 ]] || {
              echo 'LLVM signing key fingerprint mismatch' >&2; exit 1;
            }
            install -m 0644 /tmp/llvm.asc /usr/share/keyrings/overink-llvm.asc
            echo 'deb [signed-by=/usr/share/keyrings/overink-llvm.asc] https://apt.llvm.org/trixie/ llvm-toolchain-trixie-22 main' \
              > /etc/apt/sources.list.d/overink-llvm.list
            apt-get update
            apt-get install -y --no-install-recommends clang-22 lld-22 llvm-22
            clang_c=/usr/bin/clang-22
            clang_cxx=/usr/bin/clang++-22
            clang_linker=/usr/bin/ld.lld-22
          fi
          mkdir -p /src
          cd /src
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            [[ $GITHUB_PR_NUMBER =~ ^[0-9]+$ ]] || { echo 'Missing pull request number' >&2; exit 1; }
            git fetch --no-tags --depth=1 origin "refs/pull/${GITHUB_PR_NUMBER}/merge"
          else
            git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          fi
          [[ $(git rev-parse FETCH_HEAD) == "$GITHUB_SHA" ]] || { echo 'Source revision mismatch' >&2; exit 1; }
          git checkout -q --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1

          "$clang_c" --version
          "$clang_linker" --version
          if [[ $TARGET_ARCH == loong64 ]]; then
            "$clang_c" --print-targets | grep -qi loongarch || {
              echo 'Debian LLVM has no LoongArch target backend' >&2; exit 1;
            }
          fi

          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 https://sh.rustup.rs -o /tmp/overink-rustup.sh
          sh /tmp/overink-rustup.sh -y --profile minimal --default-toolchain "$RUST_VERSION" --component rustfmt --component clippy
          . "$CARGO_HOME/env"
          rustup target add "$OVERINK_TARGET"

          sdk=/tmp/overink-sdk
          if [[ $TARGET_MODE == cross ]]; then
            mkdir -p "$sdk/sysroot/usr/share" "$sdk/debs" "$sdk/cc"
            cp -a /usr/share/wayland-protocols "$sdk/sysroot/usr/share/"
            [[ ! -d /usr/share/wayland ]] || cp -a /usr/share/wayland "$sdk/sysroot/usr/share/"
          repo=https://deb.debian.org/debian
          if [[ $TARGET_ARCH == loong64 ]]; then
            repo=https://loong13.debian.net/debian-loong64
          fi
          python3 - "$repo" trixie "$TARGET_ARCH" 14 "$sdk" "$TARGET_ARCH" "$(uname -m)" <<'SDK_PY'
          import gzip, hashlib, lzma, os, pathlib, shutil, subprocess, sys, time, urllib.error, urllib.request

          repo, suite, arch, gcc_ver, work_str, short, host_arch = sys.argv[1:8]
          work, sysroot, debs_dir = pathlib.Path(work_str), pathlib.Path(work_str) / "sysroot", pathlib.Path(work_str) / "debs"

          def fetch_index(base_url, dist, binary_arch):
              errors = []
              for ext, dec in (("xz", lzma.decompress), ("gz", gzip.decompress)):
                  url = f"{base_url}/dists/{dist}/main/binary-{binary_arch}/Packages.{ext}"
                  for attempt in range(3):
                      try:
                          with urllib.request.urlopen(url, timeout=30) as response:
                              return dec(response.read()).decode("utf-8", errors="replace")
                      except urllib.error.HTTPError as exc:
                          if exc.code == 404:
                              errors.append(f"{url}: {exc}")
                              break
                          if attempt == 2:
                              errors.append(f"{url}: {exc}")
                      except Exception as exc:
                          if attempt == 2:
                              errors.append(f"{url}: {type(exc).__name__}: {exc}")
                      if attempt < 2:
                          time.sleep(attempt + 1)
              raise RuntimeError("Cannot fetch package index:\n" + "\n".join(errors))

          def parse_packages(raw):
              pkgs = {}
              for block in raw.split("\n\n"):
                  name = filename = checksum = None
                  deps, provides = [], []
                  for line in block.splitlines():
                      if line.startswith("Package: "): name = line[9:].strip()
                      elif line.startswith("Filename: "): filename = line[10:].strip()
                      elif line.startswith("SHA256: "): checksum = line[8:].strip()
                      elif line.startswith("Depends: "):
                          deps.extend(p.strip().split("|")[0].strip().split()[0].split(":")[0] for p in line[9:].split(",") if p.strip())
                      elif line.startswith("Provides: "):
                          provides.extend(p.strip().split()[0].split(":")[0] for p in line[10:].split(",") if p.strip())
                  if name and filename and checksum:
                      pkgs[name] = (filename, deps, checksum)
                      for p in provides: pkgs.setdefault(p, (filename, deps, checksum))
              return pkgs

          def extract_deb(deb_path, dest):
              if shutil.which("dpkg-deb"):
                  subprocess.run(["dpkg-deb", "-x", str(deb_path), str(dest)], check=True)
                  return
              members = subprocess.check_output(["ar", "t", str(deb_path)], text=True).splitlines()
              member = next(m for m in members if m.startswith("data.tar"))
              if member.endswith(".xz"):
                  flags = ["-xJf"]
              elif member.endswith(".gz"):
                  flags = ["-xzf"]
              elif member.endswith(".zst"):
                  flags = ["--zstd", "-xf"]
              elif member == "data.tar":
                  flags = ["-xf"]
              else:
                  raise RuntimeError(f"Unsupported DEB compression: {member}")
              with subprocess.Popen(["ar", "p", str(deb_path), member], stdout=subprocess.PIPE) as archive:
                  subprocess.run(["tar", *flags, "-", "-C", str(dest)], stdin=archive.stdout, check=True)
                  archive.stdout.close()
                  if archive.wait():
                      raise RuntimeError(f"Cannot extract {deb_path}")

          pkgs = parse_packages(fetch_index(repo, suite, arch))
          queue = [
              "libc6-dev", f"libgcc-{gcc_ver}-dev", f"libstdc++-{gcc_ver}-dev",
              "libx11-dev", "libxext-dev", "libxi-dev", "libxrandr-dev", "libxcursor-dev",
              "libxfixes-dev", "libxrender-dev", "libxss-dev", "libxtst-dev",
              "libwayland-dev", "libxkbcommon-dev", "libegl-dev", "libgl-dev",
          ]
          missing = [pkg for pkg in queue if pkg not in pkgs]
          if missing:
              raise RuntimeError(f"Missing required {suite}/{arch} packages: {', '.join(missing)}")
          seen, files = set(), []
          while queue:
              pkg = queue.pop(0)
              if pkg in seen or pkg not in pkgs: continue
              seen.add(pkg)
              fname, deps, checksum = pkgs[pkg]
              if fname not in files: files.append((fname, checksum))
              queue.extend(d for d in deps if d not in seen)

          for fname, checksum in files:
              deb_path = debs_dir / os.path.basename(fname)
              if not deb_path.exists(): urllib.request.urlretrieve(f"{repo}/{fname}", deb_path)
              if hashlib.sha256(deb_path.read_bytes()).hexdigest() != checksum: raise RuntimeError(f"Bad SHA256: {fname}")
              extract_deb(deb_path, sysroot)

          for name in ("lib", "lib64", "lib32", "libx32"):
              old, new = sysroot / name, sysroot / "usr" / name
              if old.is_dir() and not old.is_symlink():
                  shutil.copytree(old, new, dirs_exist_ok=True, symlinks=True)
                  shutil.rmtree(old)
              if not old.is_symlink() and not old.exists() and new.is_dir():
                  old.symlink_to("usr/" + name)

          for directory, dirs, filenames in os.walk(sysroot, followlinks=False):
              for item in dirs + filenames:
                  path = pathlib.Path(directory) / item
                  if path.is_symlink() and os.readlink(path).startswith("/"):
                      target = os.readlink(path).lstrip("/")
                      path.unlink()
                      path.symlink_to(os.path.relpath(sysroot / target, path.parent))
          SDK_PY

          fi

          host=$(rustc -vV | sed -n 's/^host: //p')
          if [[ $TARGET_MODE == native ]]; then
            [[ $host == "$OVERINK_TARGET" ]] || exit 1
          else
            [[ $host != "$OVERINK_TARGET" ]] || exit 1
          fi
          wayland-scanner --version

          export CARGO_BUILD_JOBS=2
          export CARGO_TARGET_DIR=/tmp/overink-target
          export CC="$clang_c" CXX="$clang_cxx"
          key=${OVERINK_TARGET//-/_}
          upper=${key^^}
          export "AR_$key=/usr/bin/llvm-ar"
          if [[ $TARGET_MODE == cross ]]; then
            sysroot="$sdk/sysroot"
            multiarch=$TARGET_TRIPLE
            if [[ $TARGET_TRIPLE == i686-linux-gnu ]]; then multiarch=i386-linux-gnu; fi
            gcc_dir=$(find "$sysroot/usr/lib/gcc" -name crtbeginS.o -print -quit)
            [[ -n $gcc_dir ]] || { echo 'Missing target startup files' >&2; exit 1; }
            gcc_dir=${gcc_dir%/*}
            mkdir -p "$sdk/cc"
            for compiler in clang clang++; do
              driver="$clang_c"
              [[ $compiler != clang++ ]] || driver="$clang_cxx"
              cat > "$sdk/cc/$compiler" <<WRAPPER
          #!/bin/sh
          exec "$driver" --target=$TARGET_TRIPLE --sysroot=$sysroot --gcc-install-dir=$gcc_dir -fuse-ld=$clang_linker -Qunused-arguments "\$@"
          WRAPPER
              chmod +x "$sdk/cc/$compiler"
            done
            if [[ $TARGET_ARCH == loong64 ]]; then
              printf 'int main(void) { return 0; }\n' > "$sdk/link-test.c"
              "$sdk/cc/clang" "$sdk/link-test.c" -o "$sdk/link-test"
              readelf -h "$sdk/link-test" | grep -q 'Machine:.*LoongArch'
            fi
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_SYSROOT_DIR="$sysroot"
            export PKG_CONFIG_LIBDIR="$sysroot/usr/lib/$multiarch/pkgconfig:$sysroot/usr/share/pkgconfig"
            export "CC_$key=$sdk/cc/clang" "CXX_$key=$sdk/cc/clang++"
            export "CARGO_TARGET_${upper}_LINKER=$sdk/cc/clang"
            export CMAKE_TOOLCHAIN_FILE="$sdk/toolchain.cmake"
            cat > "$CMAKE_TOOLCHAIN_FILE" <<CMAKE
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR ${TARGET_TRIPLE%%-*})
          set(CMAKE_SYSROOT $sysroot)
          set(CMAKE_C_COMPILER $sdk/cc/clang)
          set(CMAKE_CXX_COMPILER $sdk/cc/clang++)
          set(CMAKE_AR /usr/bin/llvm-ar)
          set(CMAKE_RANLIB /usr/bin/llvm-ranlib)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          set(SDL_X11_SHARED ON CACHE BOOL "" FORCE)
          set(SDL_WAYLAND_SHARED ON CACHE BOOL "" FORCE)
          CMAKE
          else
            export "CC_$key=$clang_c" "CXX_$key=$clang_cxx"
            export "CARGO_TARGET_${upper}_LINKER=$clang_c"
          fi

          if [[ $TARGET_MODE == native ]]; then
            cargo fmt --all -- --check
            cargo clippy --locked --target "$OVERINK_TARGET" --all-targets -- -D warnings
            cargo test --locked --release --target "$OVERINK_TARGET"
            dbus-run-session -- cargo test --locked --release --target "$OVERINK_TARGET" portal_response -- --ignored
          fi

          cargo build --locked --release --target "$OVERINK_TARGET"
          output="$CARGO_TARGET_DIR/$OVERINK_TARGET/release"
          config=$(find "$output/build" -name SDL_build_config.h -print -quit)
          test -n "$config"
          grep -q '^#define SDL_VIDEO_DRIVER_X11 1' "$config"
          grep -q '^#define SDL_VIDEO_DRIVER_WAYLAND 1' "$config"
          grep -q '^#define SDL_VIDEO_DRIVER_X11_DYNAMIC "libX11\.so' "$config"
          grep -q '^#define SDL_VIDEO_DRIVER_WAYLAND_DYNAMIC "libwayland-client\.so' "$config"
          readelf -h "$output/overink" | grep -iE "Machine:.*$ELF_MACHINE"
          case "$OVERINK_TARGET" in
            i686-*) readelf -h "$output/overink" | grep -q 'Class:.*ELF32' ;;
            s390x-*) readelf -h "$output/overink" | grep -q 'Data:.*big endian' ;;
            *) readelf -h "$output/overink" | grep -q 'Data:.*little endian' ;;
          esac
          if [[ $TARGET_MODE == native ]]; then
            OVERINK_STATE_DIR=/tmp/overink-smoke "$output/overink" --smoke-test
          fi
          tar -czf "/out/OverInk-$OVERINK_TARGET.tar.gz" -C "$output" overink -C /src LICENSE assets/fonts/OFL.txt
          CONTAINER
      - uses: actions/upload-artifact@v4
        with:
          name: OverInk-${{ matrix.target }}
          path: ${{ runner.temp }}/overink-linux-dist/*.tar.gz
          if-no-files-found: error

  package-deb:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    name: Debian 13 package · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:13
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x64, pkg_arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64, pkg_arch: arm64}
          - {runner: ubuntu-24.04, arch: i386, pkg_arch: i386}
          - {runner: ubuntu-24.04, arch: ppc64le, pkg_arch: ppc64el}
          - {runner: ubuntu-24.04, arch: riscv64, pkg_arch: riscv64}
          - {runner: ubuntu-24.04, arch: loong64, pkg_arch: loong64}
          - {runner: ubuntu-24.04, arch: s390x, pkg_arch: s390x}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Prepare container
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates curl python3
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build deb
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_ARCH: ${{ matrix.pkg_arch }}
        run: |
          set -euo pipefail
          bash package-debian.sh --buildfrom 3 --arch "$TARGET_ARCH"
          mkdir -p dist
          if [[ deb == deb ]]; then
            mapfile -t files < <(find "$HOME/debbuild" -maxdepth 1 -name '*.deb' -type f)
            (( ${#files[@]} == 1 )) || exit 1
            test "$(dpkg-deb -f "${files[0]}" Architecture)" = "$PACKAGE_ARCH"
          else
            mapfile -t files < <(find "$HOME/rpmbuild/RPMS" -name '*.rpm' -type f)
            (( ${#files[@]} == 1 )) || exit 1
            test "$(rpm -qp --qf '%{ARCH}' "${files[0]}")" = "$PACKAGE_ARCH"
          fi
          cp "${files[0]}" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: OverInk-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  package-rpm:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    name: UBI 10 package · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: registry.access.redhat.com/ubi10/ubi
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x64, pkg_arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: arm64, pkg_arch: aarch64}
          - {runner: ubuntu-24.04, arch: i386, pkg_arch: i686}
          - {runner: ubuntu-24.04, arch: ppc64le, pkg_arch: ppc64le}
          - {runner: ubuntu-24.04, arch: riscv64, pkg_arch: riscv64}
          - {runner: ubuntu-24.04, arch: loong64, pkg_arch: loongarch64}
          - {runner: ubuntu-24.04, arch: s390x, pkg_arch: s390x}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Prepare tools (Red Hat)
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          EL_MAJOR="${VERSION_ID%%.*}"
          [[ "$EL_MAJOR" == 10 ]] || { echo "Unsupported EL version: $VERSION_ID" >&2; exit 1; }
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|aarch64) ;;
            *) echo "Unsupported arch: $ARCH" >&2; exit 1 ;;
          esac
          dnf -y makecache
          command -v curl >/dev/null 2>&1 || dnf -y install curl ca-certificates

          install_epel_from_dir() {
            local base="$1" directory rpm
            for directory in Packages/e Packages; do
              rpm="$(curl -fsSL "$base/$directory/" 2>/dev/null |
                sed -n 's/.*href="\([^"/]*epel-release-[^"/]*\.noarch\.rpm\)".*/\1/p' |
                sort -V | tail -n1)" || continue
              [[ -n "$rpm" ]] || continue
              dnf -y install "$base/$directory/$rpm" && return 0
            done
            return 1
          }

          if ! rpm -q epel-release >/dev/null 2>&1; then
            FEDORA="https://dl.fedoraproject.org/pub/epel/epel-release-latest-${EL_MAJOR}.noarch.rpm"
            ROCKY="https://dl.rockylinux.org/pub/rocky/${EL_MAJOR}/extras/${ARCH}/os"
            ALMA="https://repo.almalinux.org/almalinux/${EL_MAJOR}/extras/${ARCH}/os"
            dnf -y install "$FEDORA" ||
              install_epel_from_dir "$ROCKY" ||
              install_epel_from_dir "$ALMA" ||
              { echo 'EPEL bootstrap failed (Fedora/Rocky/Alma)' >&2; exit 1; }
          fi

          dnf -y makecache --refresh
          dnf repolist --enabled | awk '$1 == "epel" {found=1; print} END {exit !found}'
          dnf -y install \
            sudo git dnf-plugins-core rsync findutils tar gzip unzip which \
            python3 ca-certificates binutils bzip2 cpio debugedit diffutils \
            elfutils file gawk patch pkgconf-pkg-config redhat-rpm-config
          dnf -y install rpm-build
          dnf -y install rpmdevtools
          rpmbuild --version
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build rpm
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          PACKAGE_ARCH: ${{ matrix.pkg_arch }}
        run: |
          set -euo pipefail
          bash package-rhel.sh --buildfrom 3 --arch "$TARGET_ARCH"
          mkdir -p dist
          if [[ rpm == deb ]]; then
            mapfile -t files < <(find "$HOME/debbuild" -maxdepth 1 -name '*.deb' -type f)
            (( ${#files[@]} == 1 )) || exit 1
            test "$(dpkg-deb -f "${files[0]}" Architecture)" = "$PACKAGE_ARCH"
          else
            mapfile -t files < <(find "$HOME/rpmbuild/RPMS" -name '*.rpm' -type f)
            (( ${#files[@]} == 1 )) || exit 1
            test "$(rpm -qp --qf '%{ARCH}' "${files[0]}")" = "$PACKAGE_ARCH"
          fi
          cp "${files[0]}" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: OverInk-rpm-${{ matrix.arch }}
          path: dist/*.rpm
          if-no-files-found: error

  freebsd:
    needs: prepare
    name: FreeBSD ${{ matrix.target }} · x64 VM
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-freebsd, cpu: x86_64, abi: amd64, layout: amd64/amd64, release: '15.1', machine: x86-64}
          - {target: i686-unknown-freebsd, cpu: i686, abi: i386, layout: i386/i386, release: '14.4', machine: '80386'}
          - {target: powerpc64le-unknown-freebsd, cpu: powerpc64le, abi: powerpc64le, layout: powerpc/powerpc64le, release: '15.1', machine: PowerPC64}
          - {target: aarch64-unknown-freebsd, cpu: aarch64, abi: aarch64, layout: arm64/aarch64, release: '15.1', machine: AArch64}
          - {target: riscv64gc-unknown-freebsd, cpu: riscv64, abi: riscv64, layout: riscv/riscv64, release: '15.1', machine: RISC-V}
    steps:
      - uses: actions/checkout@v5
      - uses: vmactions/freebsd-vm@v1
        with:
          arch: x86_64
          release: '15.1'
          usesh: true
          sync: scp
          envs: RUST_VERSION
          mem: 8192
          cpu: 3
          prepare: |
            pkg install -y curl cmake ninja pkgconf python3 libX11 libXext libXi libXrandr \
              libXcursor libXfixes libXrender libXScrnSaver libXtst libxcb libglvnd \
              wayland wayland-protocols libxkbcommon mesa-libs
          run: |
            set -eu
            export PATH="/usr/local/bin:$PATH"
            target='${{ matrix.target }}'
            machine='${{ matrix.machine }}'
            release='${{ matrix.release }}'
            test "$(uname -m)" = amd64
            fetch -qo /tmp/overink-rustup.sh https://sh.rustup.rs
            sh /tmp/overink-rustup.sh -y --profile minimal --default-toolchain "$RUST_VERSION"
            . "$HOME/.cargo/env"
            host=$(rustc -vV | sed -n 's/^host: //p')
            test "$host" = x86_64-unknown-freebsd
            export CARGO_BUILD_JOBS=2
            export CARGO_TARGET_DIR=/tmp/overink-target
            build_std=false
            if rustup target list | awk '{print $1}' | grep -qx "$target"; then
              rustup target add "$target"
            else
              rustc --print target-list | grep -qx "$target"
              rustup component add rust-src
              build_std=true
            fi
            if [ "$target" != "$host" ]; then
              work=$(mktemp -d)
              sysroot="$work/sysroot"
              mkdir -p "$sysroot"
              url="https://download.freebsd.org/releases/${{ matrix.layout }}/$release-RELEASE"
              fetch -qo "$work/MANIFEST" "$url/MANIFEST"
              fetch -qo "$work/base.txz" "$url/base.txz"
              expected=$(awk '$1 == "base.txz" { print $2 }' "$work/MANIFEST")
              test -n "$expected"
              test "$(sha256 -q "$work/base.txz")" = "$expected"
              tar -xf "$work/base.txz" -C "$sysroot"
              # X11/Wayland are dynamic SDL backends. Their public headers are
              # shared across FreeBSD ABIs. Native libraries supply SONAMEs only.
              mkdir -p "$sysroot/usr/local/include"
              for header in /usr/local/include/X11 /usr/local/include/xcb /usr/local/include/wayland*.h \
                  /usr/local/include/xkbcommon /usr/local/include/GL /usr/local/include/EGL \
                  /usr/local/include/GLES* /usr/local/include/KHR; do
                if [ -e "$header" ]; then cp -RL "$header" "$sysroot/usr/local/include/"; fi
              done
              python3 - "$sysroot" <<'PY'
            import os, pathlib, sys
            root = pathlib.Path(sys.argv[1])
            for directory, dirs, files in os.walk(root, followlinks=False):
                for name in dirs + files:
                    path = pathlib.Path(directory) / name
                    if path.is_symlink():
                        target = os.readlink(path)
                        if target.startswith('/'):
                            path.unlink()
                            path.symlink_to(os.path.relpath(root / target.lstrip('/'), path.parent))
            PY
              triple="${{ matrix.cpu }}-unknown-freebsd$release"
              extra=
              if [ '${{ matrix.cpu }}' = riscv64 ]; then extra='-march=rv64gc -mabi=lp64d'; fi
              for compiler in clang clang++; do
                cat > "$work/$compiler" <<WRAPPER
            #!/bin/sh
            exec /usr/bin/$compiler --target=$triple --sysroot="$sysroot" -fuse-ld=lld -Qunused-arguments $extra "\$@"
            WRAPPER
                chmod +x "$work/$compiler"
              done
              # Probe this header without trying to link the native X11 ELF.
              printf '#include <X11/XKBlib.h>\n' |
                "$work/clang" -isystem "$sysroot/usr/local/include" -x c -fsyntax-only -
              key=$(printf '%s' "$target" | tr '-' '_')
              upper=$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]')
              export "CC_$key=$work/clang" "CXX_$key=$work/clang++" "AR_$key=ar"
              export "CARGO_TARGET_${upper}_LINKER=$work/clang"
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_SYSROOT_DIR="$sysroot"
              export PKG_CONFIG_LIBDIR=/usr/local/libdata/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
              export CMAKE_TOOLCHAIN_FILE="$work/toolchain.cmake"
              cat > "$CMAKE_TOOLCHAIN_FILE" <<CMAKE
            set(CMAKE_SYSTEM_NAME FreeBSD)
            set(CMAKE_SYSTEM_PROCESSOR ${{ matrix.cpu }})
            set(CMAKE_SYSROOT "$sysroot")
            set(CMAKE_C_COMPILER "$work/clang")
            set(CMAKE_CXX_COMPILER "$work/clang++")
            set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
            set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
            set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY BOTH)
            set(CMAKE_LIBRARY_PATH /usr/local/lib)
            set(HAVE_XKBLIB_H ON CACHE INTERNAL "Cross-checked XKB header")
            set(SDL_X11_SHARED ON CACHE BOOL "" FORCE)
            set(SDL_WAYLAND_SHARED ON CACHE BOOL "" FORCE)
            set(SDL_WAYLAND_LIBDECOR OFF CACHE BOOL "" FORCE)
            set(SDL_KMSDRM OFF CACHE BOOL "" FORCE)
            CMAKE
            else
              cargo test --locked --release --target "$target"
            fi
            if [ "$build_std" = true ]; then
              RUSTC_BOOTSTRAP=1 CARGO_PROFILE_RELEASE_PANIC=abort cargo build \
                -Z build-std=std,panic_abort --locked --release --target "$target"
            else
              cargo build --locked --release --target "$target"
            fi
            output="$CARGO_TARGET_DIR/$target/release"
            config=$(find "$output/build" -name SDL_build_config.h -print -quit)
            test -n "$config"
            grep -q '^#define SDL_VIDEO_DRIVER_X11 1' "$config"
            grep -q '^#define SDL_VIDEO_DRIVER_WAYLAND 1' "$config"
            readelf -h "$output/overink" | grep -iE "Machine:.*$machine"
            # FreeBSD AArch64 and RISC-V identify the ABI in the ELF note.
            readelf -n "$output/overink" | grep -E 'FreeBSD[[:space:]].*NT_FREEBSD_ABI_TAG'
            if [ "$target" != "$host" ]; then
              grep -q '^#define SDL_VIDEO_DRIVER_X11_DYNAMIC "libX11\.so' "$config"
              grep -q '^#define SDL_VIDEO_DRIVER_WAYLAND_DYNAMIC "libwayland-client\.so' "$config"
              if readelf -d "$output/overink" | grep -E 'NEEDED.*(libX|libwayland|libxkbcommon|libEGL|libGL)'; then
                echo "Graphics libraries must be loaded dynamically on the target"
                exit 1
              fi
            else
              OVERINK_STATE_DIR=/tmp/overink-smoke "$output/overink" --smoke-test
            fi
            mkdir -p dist
            tar -czf "dist/OverInk-$target.tar.gz" -C "$output" overink -C "$PWD" LICENSE assets/fonts/OFL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OverInk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.prepare.outputs.tag }}
    if: github.event_name == 'workflow_dispatch'
    needs: [prepare, desktop, package-macos, package-windows, linux, freebsd, package-deb, package-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: overink-publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: OverInk-*
          path: release-input
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifact_dirs=(release-input/OverInk-*)
          if (( ${#artifact_dirs[@]} != 36 )); then
            echo "::error::Expected 36 build artifacts. Found ${#artifact_dirs[@]}."
            exit 1
          fi
          mkdir release-assets
          for dir in "${artifact_dirs[@]}"; do
            name=${dir##*/}
            archives=("$dir"/*)
            if (( ${#archives[@]} != 1 )); then
              echo "::error::Expected one package in $dir."
              exit 1
            fi
            archive=${archives[0]}
            case "$archive" in
              *.zip|*.tar.gz|*.deb|*.rpm|*.dmg|*.exe) ;;
              *) echo "::error::Unexpected package $archive."; exit 1 ;;
            esac
            test -s "$archive"
            file=${archive##*/}
            case "$name" in
              OverInk-dmg-macos-*)
                expected="OverInk-$RELEASE_VERSION-macos-${name#OverInk-dmg-macos-}.dmg"
                [[ $file == "$expected" ]] || { echo "::error::Unexpected DMG name: $file"; exit 1; }
                dest="$file"
                ;;
              OverInk-installer-windows-*)
                expected="OverInk-$RELEASE_VERSION-windows-${name#OverInk-installer-windows-}-setup.exe"
                [[ $file == "$expected" ]] || { echo "::error::Unexpected setup name: $file"; exit 1; }
                dest="$file"
                ;;
              OverInk-deb-*) dest="OverInk-$RELEASE_VERSION-linux-debian-${name#OverInk-deb-}.deb" ;;
              OverInk-rpm-*) dest="OverInk-$RELEASE_VERSION-linux-rhel-${name#OverInk-rpm-}.rpm" ;;
              *) dest="OverInk-$RELEASE_VERSION-${file#OverInk-}" ;;
            esac
            cp -- "$archive" "release-assets/$dest"
          done

          # A failed upload can be retried using this workflow's draft.
          marker="<!-- overink-build:$GITHUB_SHA -->"
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -cs --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]')
          count=$(jq length <<< "$releases")
          if (( count > 1 )) || { (( count == 1 )) &&
              ! jq -e --arg marker "$marker" '.[0] | .draft and ((.body // "") | startswith($marker))' <<< "$releases" >/dev/null; }; then
            echo "::error::Release $RELEASE_TAG already exists or has a draft from another source."
            exit 1
          fi

          # Git rejects a non-forced push to a tag on a different commit.
          git push origin "$GITHUB_SHA:refs/tags/$RELEASE_TAG"
          if (( count == 0 )); then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --target "$GITHUB_SHA" --generate-notes \
              --title "OverInk $RELEASE_TAG" --notes "$marker"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          tag_sha=$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" | cut -f1)
          if [[ $tag_sha != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG no longer points to the built commit."
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
