name: Cargo lockfile diagnostic (temporary)
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/lock-diagnostic.yml

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: Show exactly what Cargo wants to change
        shell: bash
        run: |
          set -eu
          cargo metadata --format-version 1 --no-deps >/dev/null
          git diff -- Cargo.lock
          git diff --exit-code -- Cargo.lock
