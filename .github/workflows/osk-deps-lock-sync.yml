name: Temporary OSK dependency lockfile synchronization

on:
  push:
    branches:
      - fix/osk-responsive-emoji-ime-20261120

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve the new platform dependency
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit only Cargo.lock if it changed
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock
            git commit -m 'chore(osk): resolve native input dependency lockfile [lock-sync]'
            git push origin HEAD:fix/osk-responsive-emoji-ime-20261120
          fi
