[package]
name = "overink"
version = "0.1.6"
edition = "2024"
rust-version = "1.100.0"
description = "Pressure-sensitive desktop annotation with egui and native SDL3 input"
license = "BSD-3-Clause"

[features]
# For CI environments without a window system, never for release packages.
headless-check = ["sdl3-sys/sdl-unix-console-build"]

[dependencies]
egui = { version = "=0.37.0", features = ["default_fonts"] }
base64 = "0.23"
epaint = { version = "=0.37.0", features = ["color_fonts"] }
harfrust = "=0.16.0"
sdl3-sys = { version = "=0.7.3", default-features = false, features = ["build-from-source-static", "no-default-subsystems", "sdl-video", "sdl-render", "sdl-dialog"] }
skrifa = "=0.50.0"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
moxcms = { version = "=0.9.2", features = ["in_place"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
png = "0.18"
tempfile = "3"

[build-dependencies]
cc = "=1.11.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
libloading = "0.9"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
async-channel = "2"
futures-lite = "2"
zbus = { version = "=6.3.0", default-features = false, features = ["default-rt", "proxy", "service"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSColor",
    "NSEvent",
    "NSColorSpace",
    "block2",
    "objc2-core-foundation",
] }
block2 = "=0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "UI_ViewManagement",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }
