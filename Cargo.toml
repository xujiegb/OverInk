[package]
name = "overink"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Pressure-sensitive desktop annotation with egui and native SDL3 input"
license = "BSD-3-Clause"

[features]
# For CI environments without a window system, never for release packages.
headless-check = ["sdl3-sys/sdl-unix-console-build"]

[dependencies]
egui = { version = "=0.37.0", features = ["default_fonts"] }
sdl3-sys = { version = "=0.7.3", default-features = false, features = ["build-from-source-static", "no-default-subsystems", "sdl-video", "sdl-render"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
lcms2-sys = { version = "=4.0.7", features = ["static"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1
