[package]
name = "overink"
version = "0.1.6"
edition = "2024"
rust-version = "1.100.0"
description = "Pressure-sensitive desktop annotation with egui and native SDL3 input"
license = "BSD-3-Clause"

[features]
# For CI environments without a window system, never for release packages.
headless-check = ["sdl3-sys/sdl-unix-console-build"]

[dependencies]
egui = { version = "=0.37.0", features = ["default_fonts"] }
base64 = "0.23"
epaint = { version = "=0.37.0", features = ["color_fonts"] }
harfrust = "=0.16.1"
sdl3-sys = { version = "=0.7.3", default-features = false, features = ["build-from-source-static", "no-default-subsystems", "sdl-video", "sdl-render", "sdl-dialog"] }
skrifa = "=0.50.0"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
moxcms = { version = "=0.9.2", features = ["in_place"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
png = "0.18"
tempfile = "3"

[build-dependencies]
cc = "=1.11.3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 1

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
libloading = "0.9"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
async-channel = "2"
futures-lite = "2"
x11rb = { version = "0.14.0", default-features = false, features = ["randr", "shape"] }
zbus = { version = "=6.5.0", default-features = false, features = ["default-rt", "proxy", "service"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "=0.25.0"
objc2 = "=0.6.5"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBase", "CFData", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDataProvider",
    "CGDirectDisplay",
    "CGImage",
    "objc2",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSError", "NSPathUtilities", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSColor",
    "NSEvent",
    "NSColorSpace",
    "block2",
    "objc2-core-foundation",
] }
block2 = "=0.6.2"

# Physical key events enter the platform IME; no unsafe/native pointers in
# OverInk. Linux/FreeBSD keep their existing SDL and IBus/Fcitx paths.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
enigo = { version = "=0.6.1", default-features = false }
sdl3 = { version = "=0.22.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "=0.0.27", default-features = false, features = ["advapi", "shell"] }
windows = { version = "=0.62.2", features = [
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "UI_ViewManagement",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
